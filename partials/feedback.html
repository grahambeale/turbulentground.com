<button id="feedback-launch" type="button" aria-label="Give feedback" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6 3V6a2 2 0 0 1 2-2Z"/><path d="M7 9h10M7 13h7"/></svg><span class="feedback-label">Feedback</span></button>
<dialog id="feedback-panel" class="tg-dialog" aria-labelledby="feedback-title">
  <div class="tg-dialog__body">
  <button id="feedback-close" class="tg-dialog__close" type="button" aria-label="Close feedback">&times;</button>
  <section id="feedback-compose">
    <h2 id="feedback-title" class="tg-dialog__title">Oops. Tell me what&rsquo;s not working.</h2>
    <form id="feedback-form">
      <label for="feedback-message" class="feedback-sr">Your feedback</label>
      <textarea id="feedback-message" class="tg-dialog__textarea" maxlength="5000" required placeholder="Tell Graham what you&rsquo;ve noticed&hellip;"></textarea>
      <p id="feedback-error" role="alert"></p>
      <div id="feedback-actions" class="tg-dialog__actions"><button id="feedback-send" class="tg-dialog__button tg-dialog__button--primary" type="submit">Send feedback</button></div>
    </form>
    <p class="feedback-note">Please don't include personal details. Only your message, this page's address and the time are saved. <a href="/privacy">Privacy notice</a></p>
  </section>
  <section id="feedback-success" hidden aria-labelledby="feedback-success-title">
    <div id="feedback-success-mark" aria-hidden="true">&#10003;</div>
    <h2 id="feedback-success-title" class="tg-dialog__title" tabindex="-1">Thank you</h2>
    <p id="feedback-receipt" role="status" aria-live="polite"></p>
    <button id="feedback-done" class="tg-dialog__button tg-dialog__button--quiet" type="button">Done</button>
  </section>
  </div>
</dialog>
